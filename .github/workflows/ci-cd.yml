name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'src/SampleMcpServer'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
      
    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v5
      if: github.repository == 'ballombert/POC-MCP'
      with:
        files: ./tests/SampleMcpServer.Tests/TestResults/*/coverage.cobertura.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      
    - name: Test packaging
      run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ${{ env.PROJECT_PATH }}/bin/Release/*.nupkg
        retention-days: 7

  validate-mcp:
    name: Validate MCP Server
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        
    - name: Build MCP server
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release
      
    - name: Test MCP server startup
      run: |
        # Test that the server starts without errors
        timeout 5s dotnet run --project ${{ env.PROJECT_PATH }} --configuration Release || true
        echo "MCP server startup test completed"
        
    - name: Validate MCP configuration
      run: |
        # Check that .mcp/server.json exists and is valid JSON
        if [ -f "${{ env.PROJECT_PATH }}/.mcp/server.json" ]; then
          echo "✓ MCP server.json found"
          cat "${{ env.PROJECT_PATH }}/.mcp/server.json" | jq . > /dev/null
          echo "✓ MCP server.json is valid JSON"
        else
          echo "✗ MCP server.json not found"
          exit 1
        fi

  cross-platform-build:
    name: Cross-platform Build
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        
    - name: Build for platform
      run: dotnet build --configuration Release
      
    - name: Test packaging on platform
      run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build-and-test, validate-mcp, cross-platform-build]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        
    - name: Build and pack for release
      run: |
        dotnet clean
        dotnet build --configuration Release
        dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build
        
    - name: Publish to NuGet
      run: |
        dotnet nuget push ${{ env.PROJECT_PATH }}/bin/Release/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Run security scan
      run: |
        # Install security scanning tool
        dotnet tool install --global security-scan
        # Run security scan (continue on error for now)
        security-scan ${{ env.PROJECT_PATH }}/*.csproj || true
      continue-on-error: true  # Allow failure until properly configured